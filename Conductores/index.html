<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kigo Driver - MAPA FIX FINAL</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#0a0a0a;color:#fff}
.app{max-width:480px;margin:0 auto;background:#0f0f0f;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#fff;color:#111;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;border-radius:0 0 20px 20px;z-index:10;flex-shrink:0}
.left-info{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;border:2px solid #E53935}
.btn-online{height:28px;padding:0 16px;border-radius:999px;border:none;font-weight:900;font-size:10px;display:flex;gap:6px;align-items:center}
.btn-online.on{background:#16a34a;color:#fff;border:1px solid #16a34a}
.btn-online.off{background:#1a1a1a;color:#ff4444;border:1px solid #ff4444}
.btn-icon{width:32px;height:32px;border-radius:50%;background:#f2f2f2;border:1px solid #e5e5e5;display:flex;align-items:center;justify-content:center}

/* MAPA - ESTA ES LA CONFIG QUE TE FUNCIONABA */
.map-wrapper{width:100%;height:350px;min-height:350px;max-height:350px;background:#1a1a1a;position:relative;flex-shrink:0;display:block}
#map{width:100%;height:350px;min-height:350px;display:block;background:#222}

.pedido-item{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:16px;padding:12px;margin-bottom:12px}
.btn-aceptar{position:relative;width:100%;height:44px;background:#222;border-radius:12px;border:1px solid #333;overflow:hidden;margin-top:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-aceptar-fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#E53935;transition:width 10s linear}
.btn-aceptar-text{position:relative;z-index:2;font-weight:900;font-size:13px;color:#fff}
.card-dark{background:#1c1c1c;border:1px solid #2a2a2a;border-radius:18px;padding:14px}
.modal-full{position:fixed;inset:0;z-index:9000;background:#fff;color:#111;display:none;flex-direction:column}
.modal-full.show{display:flex}
.chat-box{flex:1;background:#f7f7f7;padding:12px;overflow-y:auto}
.msg{font-size:12px;padding:8px 12px;border-radius:14px;margin-bottom:8px;max-width:80%;font-weight:600}
.msg.me{background:#E53935;color:#fff;margin-left:auto}.msg.other{background:#fff;border:1px solid #eee}
.quick{padding:8px 12px;border-radius:999px;border:1px solid #ddd;background:#fff;font-size:11px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="left-info"><img id="dAvatar" class="avatar" src="https://i.pravatar.cc/100?img=15"><div style="min-width:0"><div id="dName" style="font-weight:900;font-size:11px">Conductor Kigo</div><div id="dMoto" style="font-size:9px;opacity:.7;font-weight:700">Honda CB 125 • MOTO</div></div></div>
<div style="display:flex;justify-content:center"><button id="btnDisponible" class="btn-online on" onclick="toggleDisponible()"><span>●</span><span id="txtOnline">EN LÍNEA</span></button></div>
<div style="display:flex;justify-content:flex-end"><button class="btn-icon" onclick="alert('ajustes')"><i class="material-icons" style="font-size:18px;color:#111">settings</i></button></div>
</div>

<!-- MAPA FIJO -->
<div class="map-wrapper">
<div id="map"></div>
<div id="mapLoading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1a1a;z-index:2;font-size:12px">Cargando mapa... si no carga revisa tu API Key</div>
</div>

<div style="background:#111;padding:12px;flex:1;overflow:auto">
<div id="pedidoActivoBox"><div style="text-align:center;padding:14px;background:#1c1c1c;border-radius:14px;border:1px dashed #333;font-size:12px;opacity:.6">Sin pedidos activos</div></div>
<div style="margin-top:14px"><div style="font-size:9px;font-weight:800;opacity:.5;margin-bottom:8px">PEDIDOS EN ESPERA</div><div id="pedidosEsperaBox">Esperando pedidos...</div></div>
</div>
</div>

<div id="modalChat" class="modal-full">
<div style="padding:12px;display:flex;gap:10px;border-bottom:1px solid #eee;background:#fff;align-items:center"><button onclick="document.getElementById('modalChat').classList.remove('show')" style="width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff"><i class="material-icons">arrow_back</i></button><div><b>Mensajes</b><div style="font-size:11px;opacity:.6">Cliente ↔ Conductor</div></div></div>
<div id="chatBoxFull" class="chat-box"></div>
<div style="padding:10px;display:flex;gap:6px;overflow:auto;background:#fafafa;border-top:1px solid #eee">
<button class="quick" onclick="sendQuick('Ya voy en camino 🏍️')">Ya voy en camino</button>
<button class="quick" onclick="sendQuick('¿Dónde estás?')">¿Dónde estás?</button>
<button class="quick" onclick="sendQuick('No te veo')">No te veo</button>
<button class="quick" onclick="sendQuick('Llegué al punto')">Llegué</button>
</div>
<div style="padding:10px;display:flex;gap:8px;background:#fff;border-top:1px solid #eee"><input id="chatInputFull" placeholder="Escribe..." style="flex:1;height:44px;border-radius:12px;border:1px solid #ddd;padding:0 14px"><button onclick="sendMsgFull()" style="width:44px;height:44px;border-radius:12px;background:#111;color:#fff;border:none">➤</button></div>
</div>

<script>
const firebaseConfig = {apiKey:"AIzaSyDjxi5qxVVbC7lufDPdBWRUzkiSZ2o9gnE",authDomain:"kigo-transporte.firebaseapp.com",databaseURL:"https://kigo-transporte-default-rtdb.firebaseio.com",projectId:"kigo-transporte"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let driverData=JSON.parse(localStorage.getItem('kigo_driver_data'))||{nombre:"Conductor Kigo",moto:"Honda CB 125",tipo:"moto",foto:"https://i.pravatar.cc/100?img=15",lat:21.1561,lng:-100.9333};
let driverUid=localStorage.getItem('kigo_driver_uid')||'driver_'+Date.now();
localStorage.setItem('kigo_driver_uid',driverUid);
let map=null,directionsService,directionsRenderer,disponible=true,viajeActual=null,viajeActualId=null,chatListener=null,viajesListener=null,timers={},markerDriver=null;

window.initMap=function(){
 console.log("initMap llamado");
 const loading=document.getElementById("mapLoading");
 if(loading) loading.style.display="none";
 document.getElementById("dName").innerText=driverData.nombre;

 map=new google.maps.Map(document.getElementById("map"),{
   center:{lat:driverData.lat,lng:driverData.lng},
   zoom:15
 });
 directionsService=new google.maps.DirectionsService();
 directionsRenderer=new google.maps.DirectionsRenderer({map:map,polylineOptions:{strokeColor:"#E53935",strokeWeight:6}});
 markerDriver=new google.maps.Marker({position:{lat:driverData.lat,lng:driverData.lng},map:map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:"#16a34a",fillOpacity:1,strokeColor:"#fff",strokeWeight:2}});

 // FORZAR RESIZE - ESTO ARREGLA MAPA GRIS
 setTimeout(()=>{ google.maps.event.trigger(map,'resize'); map.setCenter({lat:driverData.lat,lng:driverData.lng}); },500);
 setTimeout(()=>{ google.maps.event.trigger(map,'resize'); },1500);

 navigator.geolocation.watchPosition(pos=>{
  driverData.lat=pos.coords.latitude; driverData.lng=pos.coords.longitude;
  if(markerDriver) markerDriver.setPosition({lat:driverData.lat,lng:driverData.lng});
  db.ref('conductores/'+driverUid).update({lat:driverData.lat,lng:driverData.lng,ts:Date.now(),disponible:true,online:true});
  if(viajeActualId) db.ref('viajes/'+viajeActualId+'/conductor').update({lat:driverData.lat,lng:driverData.lng,ts:Date.now()});
 },{},{enableHighAccuracy:true});

 escucharViajes();
}

function toggleDisponible(){if(viajeActual){alert("Con pedido activo no");return;}disponible=!disponible;document.getElementById("btnDisponible").className=disponible?"btn-online on":"btn-online off";document.getElementById("txtOnline").innerText=disponible?"EN LÍNEA":"DESCONECTADO"; if(disponible) db.ref('conductores/'+driverUid).set({...driverData,disponible:true,online:true}); else db.ref('conductores/'+driverUid).update({disponible:false});}

function escucharViajes(){
 if(viajesListener) viajesListener.off();
 viajesListener=db.ref('viajes').orderByChild('estado').equalTo('buscando');
 viajesListener.on('value',snap=>{
  if(viajeActual) return;
  const box=document.getElementById("pedidosEsperaBox"); const viajes=snap.val();
  if(!viajes){box.innerHTML="Sin pedidos";return;}
  let lista=[]; for(let id in viajes){let v=viajes[id]; if(v.tipo===driverData.tipo) lista.push({id,...v});}
  box.innerHTML=""; lista.forEach(v=>{
   const d=document.createElement("div"); d.className="pedido-item"; d.innerHTML=`<div style="font-weight:800">📍 ${v.destino.substring(0,35)}</div><div style="font-size:10px;opacity:.6">${v.origen.substring(0,30)}</div><div style="margin-top:6px"><span style="background:#16a34a20;color:#16a34a;border:1px solid #16a34a40;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900">$${v.precio} MXN</span></div><div class="btn-aceptar" id="btn_${v.id}"><div id="fill_${v.id}" class="btn-aceptar-fill"></div><div class="btn-aceptar-text">ACEPTAR VIAJE <span id="sec_${v.id}" style="background:#fff;color:#E53935;padding:2px 6px;border-radius:999px;margin-left:6px">10s</span></div></div>`;
   box.appendChild(d);
   document.getElementById("btn_"+v.id).onclick=()=>aceptarPedido(v.id);
   setTimeout(()=>document.getElementById("fill_"+v.id).style.width="0%",100);
   let s=10; let inter=setInterval(()=>{s--; const el=document.getElementById("sec_"+v.id); if(el) el.innerText=s+"s";},1000);
   setTimeout(()=>{const el=document.getElementById("btn_"+v.id); if(el) el.parentElement.remove(); clearInterval(inter);},10000);
  });
 });
}

function aceptarPedido(id){
 db.ref('viajes/'+id).once('value').then(s=>{
  const v=s.val(); if(!v || v.estado!='buscando') return;
  viajeActual=v; viajeActualId=id;
  mostrarActivo(v);
  rutaRecoger(v);
  db.ref('viajes/'+id).update({estado:'aceptado', conductor:{id:driverUid,nombre:driverData.nombre,foto:driverData.foto,placa:driverData.moto,vehiculo:driverData.moto,telefono:'4181234567',lat:driverData.lat,lng:driverData.lng,ts:Date.now()}});
  localStorage.setItem('kigo_pedido_activo',JSON.stringify(v)); localStorage.setItem('kigo_pedido_id',id);
  disponible=false; document.getElementById("btnDisponible").className="btn-online off"; document.getElementById("txtOnline").innerText="OCUPADO";
  escucharChat();
 });
}
function mostrarActivo(v){
 document.getElementById("pedidoActivoBox").innerHTML=`<div class="card-dark" style="border-color:#16a34a"><div style="color:#16a34a;font-size:9px;font-weight:900">● ACTIVO</div><div style="margin-top:8px;font-weight:800">${v.origen} → ${v.destino}</div><div style="display:flex;gap:8px;margin-top:12px"><button id="btnRuta" style="flex:1;height:44px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-weight:900">VOY EN CAMINO A RECOGER</button><button onclick="document.getElementById('modalChat').classList.add('show')" style="width:44px;height:44px;background:#fff;border-radius:12px;border:1px solid #ddd"><i class="material-icons">chat</i></button></div></div>`;
 document.getElementById("btnRuta").onclick=()=>{rutaRecoger(viajeActual); db.ref('viajes/'+viajeActualId).update({estado:'recogiendo'}); const b=document.getElementById("btnRuta"); b.innerText="VOY A ENTREGAR"; b.onclick=rutaEntregar;};
}
function rutaRecoger(v){
 const origin=new google.maps.LatLng(driverData.lat,driverData.lng); const dest=new google.maps.LatLng(v.origenLat,v.origenLng);
 directionsService.route({origin:origin,destination:dest,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{ if(status==="OK"){directionsRenderer.setDirections(res); const leg=res.routes[0].legs[0]; db.ref('viajes/'+viajeActualId).update({etaTexto:leg.duration.text,distanciaRecoger:leg.distance.text}); }});
}
function rutaEntregar(){
 const origin=new google.maps.LatLng(driverData.lat,driverData.lng); const dest=new google.maps.LatLng(viajeActual.destLat,viajeActual.destLng);
 directionsService.route({origin:origin,destination:dest,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{ if(status==="OK") directionsRenderer.setDirections(res);});
 db.ref('viajes/'+viajeActualId).update({estado:'en_curso'});
 document.getElementById("btnRuta").innerText="FINALIZAR"; document.getElementById("btnRuta").onclick=()=>{db.ref('viajes/'+viajeActualId).update({estado:'finalizado'}); location.reload();};
}
function escucharChat(){ if(chatListener) chatListener.off(); chatListener=db.ref('viajes/'+viajeActualId+'/chat'); chatListener.on('child_added',snap=>{const m=snap.val(); const box=document.getElementById("chatBoxFull"); const div=document.createElement("div"); div.className=m.de==='cliente'?'msg other':'msg me'; div.innerText=m.msg; box.appendChild(div); box.scrollTop=box.scrollHeight;});}
function sendQuick(t){ db.ref('viajes/'+viajeActualId+'/chat').push({de:'conductor',msg:t,t:Date.now()});}
function sendMsgFull(){ const i=document.getElementById("chatInputFull"); if(!i.value.trim()) return; db.ref('viajes/'+viajeActualId+'/chat').push({de:'conductor',msg:i.value.trim(),t:Date.now()}); i.value="";}

window.addEventListener('resize',()=>{ if(map) { google.maps.event.trigger(map,'resize'); map.setCenter({lat:driverData.lat,lng:driverData.lng}); }});
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&callback=initMap&libraries=places"></script>
</body>
</html>
