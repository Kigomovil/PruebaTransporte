<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kigo Transporte</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{--yellow:#FFD60A;--black:#0A0A0A;--gray:#F5F5F7}
body{background:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#map{flex:1;position:relative;background:#e5e7eb;min-height:54vh}
.bottom-sheet{background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -15px 40px rgba(0,0,0,.15);padding:14px 18px 20px;z-index:3;margin-top:-18px;max-height:46dvh;overflow-y:auto}
.route-info{background:#fff;border-radius:16px;padding:10px 16px;display:none;justify-content:center;margin-bottom:14px;border:1.5px solid #f0f0f0}
.route-info.show{display:flex}.route-dist{font-size:14px;font-weight:900;color:#000}
.field{margin-bottom:12px}.field label{font-size:9px;font-weight:800;letter-spacing:1px;opacity:.45;margin-bottom:5px;display:block}
.input-box{display:flex;align-items:center;gap:10px;background:var(--gray);border-radius:16px;height:54px;padding:0 14px;border:2px solid transparent}
.input-box input{flex:1;border:none;background:transparent;outline:none;font-weight:600;font-size:14px}
.btn-clear{width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #e5e7eb;display:none;align-items:center;justify-content:center;font-weight:800}
.btn-clear.show{display:flex}
.btn-iniciar{width:100%;height:56px;border-radius:18px;background:var(--yellow);color:#000;border:none;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%}.dot.pick{background:#00C853}.dot.dest{background:#FF1744}
.weather-card{position:absolute;top:12px;right:12px;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;border:1px solid rgba(0,0,0,.08)}
#screen2{position:fixed;inset:0;background:#fff;z-index:20;transform:translateY(100%);transition:.35s;display:flex;flex-direction:column}
#screen2.open{transform:translateY(0)}
.s2-head{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid #f0f0f0}
.back-btn{width:42px;height:42px;border-radius:12px;background:var(--gray);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.s2-body{padding:18px 16px;flex:1;overflow:auto}
.opt-card{border:2px solid #f0f0f0;border-radius:20px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;position:relative}
.opt-card.active{border-color:var(--yellow);background:#FFFEF0;box-shadow:0 8px 20px rgba(255,214,10,.25)}
.opt-left{display:flex;align-items:center;gap:14px}
.opt-img-box{width:80px;height:60px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid #f5f5f5}
.opt-img{width:70px;height:50px;object-fit:contain}
.opt-name{font-weight:900;font-size:14px}.opt-sub{font-size:10px;opacity:.55;font-weight:700}
.opt-right{text-align:right;padding-right:28px}.opt-price{font-weight:900;font-size:15px}.opt-disc{font-size:11px;color:#FF8A9B;text-decoration:line-through;transform:translateX(8px)}
.dot-select{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:#e5e7eb;border:3px solid #fff;transition:.2s}
.opt-card.active.dot-select{background:var(--yellow);box-shadow:0 0 0 4px rgba(255,214,10,.35)}
.btn-continuar{margin:12px 16px 20px;height:56px;border-radius:18px;background:var(--yellow);color:#000;border:none;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn-continuar:disabled{background:#e5e7eb;color:#9ca3af}
#screen3,#screen4{position:fixed;inset:0;background:#fff;z-index:30;transform:translateY(100%);transition:.35s;display:flex;flex-direction:column}
#screen3.open,#screen4.open{transform:translateY(0)}
#map2,#map3{flex:1;position:relative}
.s3-bottom{background:#fff;border-radius:24px 24px 0 0;margin-top:-20px;padding:16px 18px 22px;box-shadow:0 -10px 30px rgba(0,0,0,.12);z-index:2}
.addr{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.meta{font-size:11px;font-weight:800;opacity:.6;display:flex;gap:10px}
.pin-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="map"><div class="weather-card" id="weatherCard" style="display:none"><div id="weatherIcon"></div><div><div id="weatherTemp" style="font-weight:900">--°</div><div id="weatherCond" style="font-size:8px;opacity:.6;font-weight:800;text-transform:uppercase">--</div></div></div></div>
<div class="bottom-sheet">
<div id="routeInfo" class="route-info"><div style="text-align:center"><div style="font-size:9px;letter-spacing:1px;opacity:.4;font-weight:800">DISTANCIA ESTIMADA</div><div class="route-dist" id="kmText">0 km</div></div></div>
<div class="field"><label>¿DÓNDE TE RECOGEMOS?</label><div class="input-box"><div class="dot pick"></div><input id="pickup" placeholder="Escribe aquí de dónde te recogemos"><button class="btn-clear" id="clearPick">×</button></div></div>
<div class="field"><label>¿A DÓNDE VAS?</label><div class="input-box"><div class="dot dest"></div><input id="destino" placeholder="Escribe aquí a dónde quieres ir"><button class="btn-clear" id="clearDest">×</button></div></div>
<button class="btn-iniciar" id="btnIniciar" disabled>INICIAR ➤</button>
</div>

<div id="screen2">
<div class="s2-head"><button class="back-btn" id="btnBack"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div style="font-weight:900">Elige tu viaje</div></div>
<div class="s2-body">
<div class="opt-card" id="optMoto" onclick="selectOpt('moto')">
<div class="opt-left"><div class="opt-img-box"><img class="opt-img" src="https://cdn3d.iconscout.com/3d/free/thumb/free-bike-3d-icon-download-in-png-blend-fbx-gltf-file-formats--vehicle-transportation-pack-vehicles-icons-5182453.png"></div><div><div class="opt-name">Moto</div><div class="opt-sub">1 pasajero • Rápido</div></div></div>
<div class="opt-right"><div class="opt-price" id="priceMoto">$0 MXN</div><div class="opt-disc" id="discMoto">$0 MXN</div></div><div class="dot-select"></div>
</div>
<div class="opt-card" id="optCarro" onclick="selectOpt('carro')">
<div class="opt-left"><div class="opt-img-box"><img class="opt-img" src="https://cdn3d.iconscout.com/3d/free/thumb/free-car-3d-icon-download-in-png-blend-fbx-gltf-file-formats--vehicle-automobile-transportation-pack-vehicles-icons-5182440.png"></div><div><div class="opt-name">Carro</div><div class="opt-sub">4 pasajeros • Cómodo</div></div></div>
<div class="opt-right"><div class="opt-price" id="priceCarro">$0 MXN</div><div class="opt-disc" id="discCarro">$0 MXN</div></div><div class="dot-select"></div>
</div>
</div>
<button class="btn-continuar" id="btnContinuar" disabled>CONTINUAR ➤</button>
</div>

<div id="screen3">
<div style="padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0f0"><button class="back-btn" id="btnBack3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div style="font-weight:900;font-size:14px">Confirma punto de recogida</div></div>
<div id="map2"><div class="pin-center"><svg width="44" height="44" viewBox="0 0 24 24" fill="#00C853"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg></div></div>
<div class="s3-bottom"><div class="addr" id="addr2">Cargando...</div><div class="meta"><span id="kmText2">0 km</span><span id="timeText2">0 min</span><span id="priceText2" style="color:#000;font-weight:900">$0 MXN</span></div><button class="btn-iniciar" id="btnConfirmarPick" style="margin-top:12px">CONFIRMAR RECOGIDA ➤</button></div>
</div>

<div id="screen4">
<div style="padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0f0"><button class="back-btn" id="btnBack4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button><div style="font-weight:900;font-size:14px">Confirma punto de entrega</div></div>
<div id="map3"><div class="pin-center"><svg width="44" height="44" viewBox="0 0 24 24" fill="#FF1744"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg></div></div>
<div class="s3-bottom"><div class="addr" id="addr3">Cargando...</div><div class="meta"><span id="kmText3">0 km</span><span id="timeText3">0 min</span><span id="priceText3" style="color:#000;font-weight:900">$0 MXN</span></div><button class="btn-iniciar" id="btnConfirmarDest" style="margin-top:12px">CONFIRMAR DESTINO ➤</button></div>
</div>

<script>
const DOLORES={lat:21.1585,lng:-100.9340};
let map,map2,map3,directionsService,directionsRenderer,directionsRenderer2,directionsRenderer3,autocompletePick,autocompleteDest,markerPick,markerDest,geocoder,kmGlobal=0,timeGlobal="",selected="",pickPos=null,destPos=null;
function initMap(){
  map=new google.maps.Map(document.getElementById("map"),{center:DOLORES,zoom:14,disableDefaultUI:true});
  geocoder=new google.maps.Geocoder(); directionsService=new google.maps.DirectionsService();
  directionsRenderer=new google.maps.DirectionsRenderer({map:map,suppressMarkers:true,polylineOptions:{strokeColor:"#00C853",strokeWeight:5}});
  autocompletePick=new google.maps.places.Autocomplete(document.getElementById("pickup"),{componentRestrictions:{country:["mx"]}});
  autocompleteDest=new google.maps.places.Autocomplete(document.getElementById("destino"),{componentRestrictions:{country:["mx"]}});
  autocompletePick.addListener("place_changed",()=>{let p=autocompletePick.getPlace();if(!p.geometry)return;pickPos=p.geometry.location;setPickup(pickPos);document.getElementById("clearPick").classList.add("show");if(destPos)calcRoute();checkIniciar();});
  autocompleteDest.addListener("place_changed",()=>{let p=autocompleteDest.getPlace();if(!p.geometry)return;destPos=p.geometry.location;setDest(destPos);document.getElementById("clearDest").classList.add("show");if(pickPos)calcRoute();checkIniciar();});
  pedirUbicacion(); cargarClima();
  document.getElementById("btnIniciar").onclick=openScreen2;
  document.getElementById("btnBack").onclick=()=>document.getElementById("screen2").classList.remove("open");
  document.getElementById("btnBack3").onclick=()=>document.getElementById("screen3").classList.remove("open");
  document.getElementById("btnBack4").onclick=()=>document.getElementById("screen4").classList.remove("open");
  document.getElementById("btnContinuar").onclick=openScreen3;
  document.getElementById("btnConfirmarPick").onclick=()=>{document.getElementById("screen3").classList.remove("open");openScreen4();};
  document.getElementById("btnConfirmarDest").onclick=()=>alert("Viaje confirmado "+kmGlobal.toFixed(1)+" km - "+selected);
}
function pedirUbicacion(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{const ll=new google.maps.LatLng(pos.coords.latitude,pos.coords.longitude);pickPos=ll;map.setCenter(ll);map.setZoom(16);setPickup(ll);reverse(ll);});}}
function reverse(ll){geocoder.geocode({location:ll},(r,s)=>{if(s==="OK"&&r[0]){document.getElementById("pickup").value=r[0].formatted_address;document.getElementById("clearPick").classList.add("show");}});}
function setPickup(pos){if(markerPick)markerPick.setMap(null);markerPick=new google.maps.Marker({position:pos,map:map,icon:{url:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='32' viewBox='0 0 22 32'%3E%3Cpath fill='%2300C853' d='M11 0C4.9 0 0 4.9 0 11c0 8 11 21 11 21s11-13 11-21C22 4.9 17.1 0 11 0z'/%3E%3Ccircle cx='11' cy='11' r='5' fill='white'/%3E%3C/svg%3E",scaledSize:new google.maps.Size(22,32)}});}
function setDest(pos){if(markerDest)markerDest.setMap(null);markerDest=new google.maps.Marker({position:pos,map:map,icon:{url:"data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='22' height='32' viewBox='0 0 22 32'%3E%3Cpath fill='%23FF1744' d='M11 0C4.9 0 0 4.9 0 11c0 8 11 21 11 21s11-13 11-21C22 4.9 17.1 0 11 0z'/%3E%3Ccircle cx='11' cy='11' r='5' fill='white'/%3E%3C/svg%3E",scaledSize:new google.maps.Size(22,32)}});}
function calcRoute(){
  if(!pickPos||!destPos)return;
  directionsService.route({origin:pickPos,destination:destPos,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{
    if(status==="OK"){
      directionsRenderer.setDirections(res);
      const leg=res.routes[0].legs[0]; kmGlobal=leg.distance.value/1000; timeGlobal=leg.duration.text;
      document.getElementById("kmText").innerText=leg.distance.text; document.getElementById("routeInfo").classList.add("show");
      const priceMoto=Math.max(35,kmGlobal*12); const priceCar=Math.max(60,kmGlobal*18);
      document.getElementById("priceMoto").innerText=`$${priceMoto.toFixed(0)} MXN`; document.getElementById("discMoto").innerText=`$${(priceMoto*1.25).toFixed(0)} MXN`;
      document.getElementById("priceCarro").innerText=`$${priceCar.toFixed(0)} MXN`; document.getElementById("discCarro").innerText=`$${(priceCar*1.25).toFixed(0)} MXN`;
    }
  });
}
function checkIniciar(){if(document.getElementById("pickup").value && document.getElementById("destino").value){document.getElementById("btnIniciar").disabled=false;}else{document.getElementById("btnIniciar").disabled=true;}}
function selectOpt(t){
  selected=t; document.querySelectorAll(".opt-card").forEach(c=>c.classList.remove("active"));
  document.getElementById(t==="moto"?"optMoto":"optCarro").classList.add("active");
  document.getElementById("btnContinuar").disabled=false;
}
function openScreen2(){if(!pickPos||!destPos)return; calcRoute(); document.getElementById("screen2").classList.add("open");}
function openScreen3(){
  document.getElementById("screen3").classList.add("open");
  setTimeout(()=>{
    map2=new google.maps.Map(document.getElementById("map2"),{center:pickPos,zoom:20,disableDefaultUI:true});
    directionsRenderer2=new google.maps.DirectionsRenderer({map:map2,suppressMarkers:true,polylineOptions:{strokeColor:"#00C853",strokeWeight:5}});
    map2.addListener("click",(e)=>{pickPos=e.latLng; updateAddr(pickPos,"addr2"); calcRoute2();});
    map2.addListener("idle",()=>{const c=map2.getCenter(); pickPos=c; updateAddr(c,"addr2");});
    updateAddr(pickPos,"addr2"); calcRoute2();
  },300);
}
function openScreen4(){
  document.getElementById("screen4").classList.add("open");
  setTimeout(()=>{
    map3=new google.maps.Map(document.getElementById("map3"),{center:destPos,zoom:20,disableDefaultUI:true});
    directionsRenderer3=new google.maps.DirectionsRenderer({map:map3,suppressMarkers:true,polylineOptions:{strokeColor:"#FF1744",strokeWeight:5}});
    map3.addListener("click",(e)=>{destPos=e.latLng; updateAddr(destPos,"addr3"); calcRoute2();});
    map3.addListener("idle",()=>{const c=map3.getCenter(); /* solo si quiere mover */});
    updateAddr(destPos,"addr3"); calcRoute2();
  },300);
}
function updateAddr(ll,id){geocoder.geocode({location:ll},(r,s)=>{if(s==="OK"&&r[0])document.getElementById(id).innerText=r[0].formatted_address;});}
function calcRoute2(){
  if(!pickPos||!destPos)return;
  directionsService.route({origin:pickPos,destination:destPos,travelMode:google.maps.TravelMode.DRIVING},(res,status)=>{
    if(status==="OK"){
      if(map2)directionsRenderer2.setDirections(res);
      if(map3)directionsRenderer3.setDirections(res);
      const leg=res.routes[0].legs[0]; kmGlobal=leg.distance.value/1000; timeGlobal=leg.duration.text;
      const priceMoto=Math.max(35,kmGlobal*12); const priceCar=Math.max(60,kmGlobal*18);
      const price = selected==="moto"?priceMoto:priceCar;
      document.getElementById("kmText2").innerText=leg.distance.text; document.getElementById("timeText2").innerText=timeGlobal; document.getElementById("priceText2").innerText=`$${price.toFixed(0)} MXN`;
      document.getElementById("kmText3").innerText=leg.distance.text; document.getElementById("timeText3").innerText=timeGlobal; document.getElementById("priceText3").innerText=`$${price.toFixed(0)} MXN`;
      document.getElementById("kmText").innerText=leg.distance.text;
    }
  });
}
function cargarClima(){
  fetch(`https://api.openweathermap.org/data/2.5/weather?lat=21.1585&lon=-100.934&units=metric&lang=es&appid=439d4b804bc8187953eb36d2a8c26a02`).then(r=>r.json()).then(d=>{
    if(!d.main)return; document.getElementById("weatherCard").style.display="flex";
    document.getElementById("weatherTemp").innerText=Math.round(d.main.temp)+"°";
    document.getElementById("weatherCond").innerText=d.weather[0].description;
    let icon=d.weather[0].main.toLowerCase().includes("cloud")?`<svg viewBox="0 0 24 24" fill="#FFD60A"><path d="M6 19a4 4 0 01-.88-7.88A5.5 5.5 0 0117.5 9 4.5 4.5 0 1118 19H6z"/></svg>`:`<svg viewBox="0 0 24 24" fill="#FFD60A"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
    document.getElementById("weatherIcon").innerHTML=icon;
  });
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTV1sm6McEIkv-cheaVFCD_svp_a--6wg&libraries=places&callback=initMap" async defer></script>
</body>
</html>
